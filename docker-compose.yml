services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulse_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Containerized copy of the same backend. The operator's native :8000 stays the
  # demo target; this one exists to prove the whole stack runs from compose alone.
  gateway:
    build: .
    container_name: pulse_gateway
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      # The container reaches the host's GPU-served Ollama; the model never runs here.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: qdrant
    env_file:
      - .env
    volumes:
      - gateway_data:/app/data
    depends_on:
      - qdrant

  # TLS termination. The gateway itself keeps no public port beyond the loopback
  # 8010 mapping used for direct comparison; every browser-facing path goes here.
  caddy:
    image: caddy:2-alpine
    container_name: pulse_caddy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - gateway

  # Scrapes the ledger-backed gauges on /api/gateway/metrics.
  prometheus:
    image: prom/prometheus:latest
    container_name: pulse_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

volumes:
  qdrant_data:
  gateway_data:
  caddy_data:
